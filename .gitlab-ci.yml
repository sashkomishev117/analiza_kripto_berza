stages:
  - build
  - deploy

variables:
  DOCKER_REGISTRY: $ACR_REGISTRY

services:
  - docker:dind

before_script:
  - docker login $DOCKER_REGISTRY -u $ACR_USERNAME -p $ACR_PASSWORD

build_images:
  stage: build
  image: docker:latest
  script:
    # Notice the quotes "" around paths because of the space in "Домашна 4"
    
    # Build and Push Frontend
    - docker build -t $DOCKER_REGISTRY/frontend:latest "./Домашна 4/crypto-analysis/src"
    - docker push $DOCKER_REGISTRY/frontend:latest
    
    # Build and Push Server
    - docker build -t $DOCKER_REGISTRY/server:latest "./Домашна 4/crypto-analysis/server"
    - docker push $DOCKER_REGISTRY/server:latest

    # Build and Push Microservices
    - docker build -t $DOCKER_REGISTRY/analytics:latest "./Домашна 4/crypto-analysis/analytics-service"
    - docker push $DOCKER_REGISTRY/analytics:latest
    
    - docker build -t $DOCKER_REGISTRY/coins:latest "./Домашна 4/crypto-analysis/coins-service"
    - docker push $DOCKER_REGISTRY/coins:latest

    # Build and Push Nginx Gateway
    - docker build -t $DOCKER_REGISTRY/nginx:latest "./Домашна 4/crypto-analysis/nginx"
    - docker push $DOCKER_REGISTRY/nginx:latest

deploy_to_azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal -u $AZURE_APP_ID -p $AZURE_PASSWORD --tenant $AZURE_TENANT_ID
    - az webapp config container set --name $APP_NAME --resource-group $RESOURCE_GROUP --multicontainer-config-type compose --multicontainer-config-file "Домашна 4/crypto-analysis/docker-compose.prod.yml"
  only:
    - main
    - master
