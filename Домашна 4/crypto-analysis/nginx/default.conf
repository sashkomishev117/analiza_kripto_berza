server {
    listen 80;

    # Serve React Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route /api to the Main Server
    location /api {
        rewrite ^/api/(.*) /$1 break; # Removes /api prefix before sending to server
        proxy_pass http://server:5000; # Assuming your server runs on port 5000
        proxy_set_header Host $host;
    }
}
