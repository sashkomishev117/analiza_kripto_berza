version: '3.8'

services:
  coins:
    build: ./coins-service
    ports:
      - "8081:8081"
    networks:
      - app-network

  analytics:
    build: ./analytics-service
    ports:
      - "8082:8082"
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - coins
      - analytics
    networks:
      - app-network
    environment:
      - VITE_API_URL=http://coins:8081

networks:
  app-network:
    driver: bridge
